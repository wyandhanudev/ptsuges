<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#00d4ff" stroke-width="3"/>
  
  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="85" fill="rgba(10, 14, 39, 0.8)" stroke="#0099cc" stroke-width="2"/>
  
  <!-- Code Symbol: { -->
  <path d="M 60 70 Q 40 85, 60 100 Q 40 115, 60 130" 
        fill="none" stroke="#00d4ff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Code Symbol: > -->
  <line x1="75" y1="60" x2="120" y2="100" stroke="#ff00ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="100" x2="75" y2="140" stroke="#ff00ff" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Code Symbol: } -->
  <path d="M 140 70 Q 160 85, 140 100 Q 160 115, 140 130" 
        fill="none" stroke="#00d4a3" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Center Dot -->
  <circle cx="100" cy="100" r="5" fill="#00d4ff"/>
  
  <!-- Text -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
        text-anchor="middle" fill="#00d4ff">SUGES</text>
</svg>
